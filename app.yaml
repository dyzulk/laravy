name: laravy
app_id: da_KwGIWtMUgQPE
owner: dyzulk
package: .
scaling:
  mode: single_concurrency
jobs:
- name: after_deploy
  trigger: post-deployment
  action:
    execute:
      command: after_deploy
- name: queue_worker
  trigger: '* * * * *'
  action:
    execute:
      command: php
      cli_args:
      - artisan
      - queue:work
      - --stop-when-empty
annotations:
  shipitcli.com/config:
    build_command: npm run build
    commands:
      build: composer run-script deploy && npm run build
    composer_build_script: deploy
    convert_redirects: true
    extra_dependencies: []
    framework: laravel
    node_version: '22'
    package_manager: npm
    php_version: 8.4.21
    phpix: true
    phpix_worker_threads: 4
    port: 8080
    sws_version: 2.38.0
    use_composer: true
  shipitcli.com/provider: laravel
  shipitcli.com/version: 0.19.8
kind: wasmer.io/App.v0
